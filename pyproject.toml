[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factorminer"
version = "0.1.0"
description = "LLM-powered quantitative factor mining with evolutionary search"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "FactorMiner Team"},
]
keywords = ["quantitative-finance", "factor-mining", "llm", "alpha-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "bottleneck>=1.4",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "click>=8.0",
    "tqdm>=4.65",
    "networkx",
    "sympy",
    "fastparquet",
    "xgboost-cpu",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
    "cupy-cuda12x; platform_system == 'Linux'",
]
llm = [
    "openai",
    "anthropic",
    "google-generativeai",
]
embeddings = [
    "sentence-transformers>=2.0",
    "faiss-cpu>=1.7",
]
research = [
    "networkx>=3.0",
    "statsmodels>=0.14.0",
    "sympy>=1.13",
]
ml = [
    "torch>=2.0",
    "xgboost-cpu>=2.0",
]
visualization = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tabulate>=0.9",
]
mcp = [
    "mcp>=1.27,<2",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "basedpyright",
]
all = [
    "cupy-cuda12x; platform_system == 'Linux'",
    "torch>=2.0",
    "openai",
    "anthropic",
    "google-generativeai",
    "sentence-transformers>=2.0",
    "faiss-cpu>=1.7",
    "networkx>=3.0",
    "statsmodels>=0.14.0",
    "sympy>=1.13",
    "xgboost>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tabulate>=0.9",
    "mcp>=1.27,<2",
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
factorminer = "factorminer.cli:main"

[project.urls]
Homepage = "https://github.com/minihellboy/factorminer"
Repository = "https://github.com/minihellboy/factorminer"
Issues = "https://github.com/minihellboy/factorminer/issues"

[tool.setuptools.packages.find]
include = ["factorminer*"]
exclude = ["factorminer.tests*"]

[tool.setuptools.package-data]
"factorminer.configs" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = [
    # Quant research code uses matrix notation such as M, T, X, and K.
    "N803",
    "N806",
    # Formula catalogs and LLM prompts are intentionally long string literals.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"scripts/run_demo.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["factorminer/tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

# =========================
# Basedpyright 额外规则（可选）
# =========================
# basedpyright 在 pyright 基础上增加了一些更严格的规则，
# 可以在这里单独控制（不同版本规则名可能略有差异，以实际为准）。
[tool.basedpyright]
# 示例：启用一些推荐的额外检查
# 注意：basedpyright 的配置键和规则名可能随版本变化，
# 这里给出常见模式，实际以文档/报错提示为准。
typeCheckingMode = "standard"  # 通常与 pyright 保持一致

# 若 basedpyright 支持类似 pyright 的规则开关，可这样写：
# reportUnannotatedClassAttribute = "warning"
# reportIncompatibleUnannotatedOverride = "warning"

allowedUntypedLibraries = ["joblib"]
reportUnusedCallResult = false
reportDeprecated = false
reportAny = false
reportMissingTypeStubs = false
reportUnusedParameter = false
reportUnsafeMultipleInheritance = false
reportUnusedFunction = false
reportUnknownMemberType = false
reportUnusedExpression = false
